[Service]
ExecStart=
ExecStart=/opt/rent-monitor/current/.venv/bin/python -m rent_monitor.main serve --config /opt/rent-monitor/current/config/search.toml
Environment=PYTHONPATH=/opt/rent-monitor/current/src
Environment=RENT_MONITOR_BROWSER_BACKEND=home-pow
Environment=RENT_MONITOR_COLLECT_DETAILS=1
Environment=RENT_MONITOR_POW_PYTHON=/opt/rent-monitor/home-route/.venv/bin/python
Environment=RENT_MONITOR_POW_WORKER=/opt/rent-monitor/home-route/home-pow-worker.py
UnsetEnvironment=RENT_MONITOR_PROXY_FILE
