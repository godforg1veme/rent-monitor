[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-monitor"
version = "0.1.0"
description = "Монитор новых объявлений долгосрочной аренды в Москве"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.26,<4",
    "aiosqlite>=0.21,<1",
    "httpx>=0.27,<1",
    "playwright>=1.55,<2",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["ruff>=0.13,<1"]

[project.scripts]
rent-monitor = "rent_monitor.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
